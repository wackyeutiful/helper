services:
  mongodb:
    image: mongo:7.0
    container_name: helper_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: helper
    volumes:
      - mongo_data:/data/db
    networks:
      - helper-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: helper_backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/helper?authSource=admin
    depends_on:
      - mongodb
      - ai-service
    networks:
      - helper-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: helper_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - helper-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: helper_ai
    ports:
      - "5001:5001"
    networks:
      - helper-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: helper_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - helper-network
    restart: unless-stopped
    command: serve

volumes:
  mongo_data:
  ollama_data:

networks:
  helper-network: