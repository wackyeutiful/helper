services:
  mongodb:
    image: mongo:7.0
    container_name: helper_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: helper
    volumes:
      - mongo_data:/data/db
    networks:
      - helper-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: helper_backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/helper?authSource=admin
    depends_on:
      - mongodb
      - ai-service
    networks:
      - helper-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: helper_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - helper-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: helper_ai
    ports:
      - "5001:5001"
    networks:
      - helper-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: helper_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - helper-network
    restart: unless-stopped
    command: serve

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: helper_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - helper-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: helper_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - helper-network
    restart: unless-stopped

volumes:
  mongo_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  helper-network: